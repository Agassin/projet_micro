name: CI/CD pipeline

on:
  push:
    branches:
      - master

env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE_NAME: projet_micro
  DOCKER_TAG: latest

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django tests
        working-directory: web_app
        run: python manage.py test

      - name: Run Flake8
        run: python -m flake8 web_app/

  build:
    name: Build Docker container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f web_app/Dockerfile -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} .

      - name: Test Docker container
        run: |
          docker run -d --name test_container -p 8000:8000 ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          sleep 10
          docker logs test_container
          docker stop test_container
          docker rm test_container