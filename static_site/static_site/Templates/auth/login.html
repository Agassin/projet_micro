<!-- static_site/templates/auth/login.html -->
{% extends 'base.html' %}

{% block title %}Connexion - Mon Site Statique{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2>Connexion</h2>
        
        <form method="post" class="auth-form-content">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>
        
        <div class="auth-links">
            <p>Pas encore de compte ? <a href="{% url 'register' %}">Inscrivez-vous ici</a></p>
            <p><a href="{% url 'home' %}">Retour à l'accueil</a></p>
        </div>
    </div>
</div>
{% endblock %}
